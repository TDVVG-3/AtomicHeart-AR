name: Build and verify 1.0.2
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish v1.0.2 in TDVVG-3/AtomicHeart-AR after all checks pass'
        type: boolean
        default: false
  push:
    branches: [release/1.0.2]
  pull_request:
    paths: ['app/**', 'scripts/package*', 'scripts/build_payload_1_0_2.py', 'scripts/prepare_appdir.py', '.github/workflows/release-1.0.2.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified upstream build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force tools/bin/repak, tools/bin/unreallocres, build | Out-Null
          Invoke-WebRequest https://github.com/TDVVG-3/AtomicHeart-AR/releases/download/v1.0.0/AtomicHeart-AR-1.0.0-p12.zip -OutFile build/base-p12.zip
          Invoke-WebRequest https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip -OutFile build/repak.zip
          if ((Get-FileHash build/repak.zip).Hash.ToLowerInvariant() -ne '6720d602144d75df477a99d5bedb6ea780997546afc335901d4937cafeaa73fa') { throw 'repak hash mismatch' }
          Expand-Archive build/repak.zip tools/bin/repak -Force
          Invoke-WebRequest https://github.com/akintos/UnrealLocres/releases/download/1.1.1/UnrealLocres.exe -OutFile tools/bin/unreallocres/UnrealLocres.exe
          python scripts/build_payload_1_0_2.py build/base-p12.zip
          if ($LASTEXITCODE) { throw 'Payload build failed' }
      - name: Test subtitle and glyph regressions
        run: python -m unittest discover -s tests -p test_display_regressions.py -v
      - name: Package and test Windows installer
        run: ./scripts/package_installer.ps1 -PayloadZip dist/AtomicHeart-AR-1.0.2-payload.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-and-payload-1.0.2
          path: dist/*
          if-no-files-found: error
  linux:
    needs: windows
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: windows-and-payload-1.0.2
          path: dist
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-dejavu-core libfontconfig1 libice6 libsm6 libx11-6 libxrandr2 libxcursor1 libxi6 libgl1 desktop-file-utils
      - name: Build and test self-contained AppImage
        run: mkdir -p build && bash scripts/package_appimage.sh dist/AtomicHeart-AR-1.0.2-payload.zip
      - name: Render the packaged Arabic interface
        run: |
          set -o pipefail
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 60s xvfb-run -a /usr/bin/time -v -o dist/linux-smoke-metrics.txt ./dist/AtomicHeart-AR-1.0.2-linux-x86_64.AppImage --smoke-test "$PWD/dist/linux-interface.png" | tee dist/linux-smoke.log
          grep -q GUI_SMOKE_PASS dist/linux-smoke.log
          test -s dist/linux-interface.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-1.0.2
          path: |
            dist/*.AppImage*
            dist/linux-*
          if-no-files-found: error
  publish:
    needs: [windows, linux]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.repository == 'TDVVG-3/AtomicHeart-AR'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-and-payload-1.0.2
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage-1.0.2
          path: dist
      - name: Verify all downloadable files
        working-directory: dist
        run: |
          sha256sum -c AtomicHeart-AR-1.0.2-payload.zip.sha256
          sha256sum -c AtomicHeart-AR-1.0.2-win-x64.zip.sha256
          sha256sum -c AtomicHeart-AR-1.0.2-linux-x86_64.AppImage.sha256
      - name: Publish verified release in the original repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.0.2 >/dev/null 2>&1; then
            echo "v1.0.2 already exists; refusing to overwrite an existing release."
            exit 1
          fi
          gh release create v1.0.2 --draft --target "$GITHUB_SHA" --title "AtomicHeart-AR 1.0.2 · Windows + AppImage" --notes-file docs/releases/v1.0.2-publish.md
          gh release upload v1.0.2 dist/AtomicHeart-AR-1.0.2-win-x64.zip dist/AtomicHeart-AR-1.0.2-win-x64.zip.sha256 dist/AtomicHeart-AR-1.0.2-linux-x86_64.AppImage dist/AtomicHeart-AR-1.0.2-linux-x86_64.AppImage.sha256 dist/AtomicHeart-AR-1.0.2-payload.zip dist/AtomicHeart-AR-1.0.2-payload.zip.sha256
          gh release edit v1.0.2 --draft=false --latest
